<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - FOODLENZ</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="icon" href="Photoes/School Logo.png" type="image/png">
</head>
<body>

    </div>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>FOODLENZ</h1>
                <p>Eat Smart, Reach Fast</p>
            </div>
            
            <form id="signupForm" class="auth-form">
                <h2>Create Account</h2>
                
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your full name">
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Create a password" minlength="6">
                </div>
                
                <div class="form-group">
                    <label for="city">City</label>
                    <select id="city" name="city" required>
                        <option value="">Select your city</option>
                        <option value="Islamabad">Islamabad</option>
                        <option value="Lahore">Lahore</option>
                        <option value="Karachi">Karachi</option>
                        <option value="Rawalpindi">Rawalpindi</option>
                        <option value="Faisalabad">Faisalabad</option>
                        <option value="Multan">Multan</option>
                    </select>
                </div>
                
                <div id="error-message" class="error-message"></div>
                
                <button type="submit" class="auth-btn">Sign Up</button>
                
                <p class="auth-switch">
                    Already have an account? <a href="signin.html">Login here</a>
                </p>
            </form>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
