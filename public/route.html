<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Route Finder - FOODLENZ</title>
    <link rel="stylesheet" href="Styles.css">
    <link rel="stylesheet" href="Responsive.css">
    <link rel="stylesheet" href="css/route.css">
    <link rel="icon" href="/public/Photoes/logo.jpg" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
    <div id="map"></div>

    <div class="header">
        <a href="index.html" class="logo-container">
            <img src="/public/Photoes/logo.jpg" alt="Logo">
            <div class="school-name">
                <div>FOODLENZ</div>
                <div>Eat Smart, Reach Fast</div>
            </div>
        </a>

        <div class="nav-right" style="display: flex; align-items: center; gap: 15px;">
            <button class="hamburger" id="hamburger" style="color: white; background: none; border: none; font-size: 28px; cursor: pointer;">&#9776;</button>
        </div>
        <nav id="main-nav">
            <a href="index.html">HOME</a>
            <a href="search.html">SEARCH</a>
            <a href="route.html" class="active">MAP ROUTE</a>
            <button class="admissions-btn" onclick="logout()">LOGOUT</button>
        </nav>
    </div>

    <div class="sidebar" id="sidebar">
        <a href="index.html">HOME</a>
        <a href="search.html">SEARCH</a>
        <a href="route.html" class="active">MAP ROUTE</a>
        <button class="admissions-btn" onclick="logout()">LOGOUT</button>
    </div>

    <div class="route-container">
        <!-- Floating Left Panel -->
        <div class="control-panel animate-in">
            <div class="route-hero">
                <h1 style="background: var(--accent-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; font-size: 28px;">
                    Smart Navigation
                </h1>
                <p style="color: var(--text-dim); margin-bottom: 25px;">Advanced routing powered by FoodLens AI</p>
            </div>

            <div class="form-group">
                <label>Origin</label>
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <input type="text" id="start-location-input" placeholder="Where are you starting from?" style="flex: 1;">
                    <button id="pin-location-btn" onclick="pinCurrentLocation()" title="Use My Current Location"
                            style="background: var(--bg-surface-light); border: 1px solid var(--glass-border); border-radius: 12px; padding: 0 15px; color: var(--accent); cursor: pointer; transition: 0.3s;">
                        📍
                    </button>
                </div>
                <input type="hidden" id="start-lat">
                <input type="hidden" id="start-lng">
            </div>

            <div class="form-group">
                <label>Destination Restaurant</label>
                <div class="autocomplete-container">
                    <input type="text" id="restaurant-search" placeholder="Search saved restaurants..." autocomplete="off">
                    <div id="suggestions-dropdown" class="suggestions-list" style="background: #1a1a1a; border-radius: 12px; margin-top: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none;"></div>
                    <input type="hidden" id="selected-restaurant-id">
                </div>
            </div>

            <button class="calculate-btn" id="explore-btn" onclick="calculateRoute()" style="margin: 30px 0;">
                <span>Explore Selection <span class="icon icon-route" style="margin-left: 8px; width: 14px; height: 14px;"></span></span>
            </button>
        </div>

        <!-- Floating Stats Overlay -->
        <div class="route-stats-overlay animate-in" id="route-stats" style="display: none;">
            <div class="stat-item">
                <span class="stat-val" id="distance-stat">-</span>
                <span class="stat-lbl">Kilometers</span>
            </div>
            <div class="stat-divider" style="width: 1px; background: var(--glass-border);"></div>
            <div class="stat-item">
                <span class="stat-val" id="time-stat">-</span>
                <span class="stat-lbl">Minutes</span>
            </div>
            <div class="stat-divider" style="width: 1px; background: var(--glass-border);"></div>
            <div class="stat-item">
                <span class="stat-val" id="traffic-stat">Normal</span>
                <span class="stat-lbl">Traffic</span>
            </div>
        </div>

        <!-- Floating Right Panel -->
        <div class="info-panels animate-in" id="info-panels" style="display: none;">
            <div class="info-card">
                <h3 style="margin-bottom: 20px; font-size: 16px; color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: 1px;">Algorithmic Topology</h3>
                <div id="graph-canvas" style="background: rgba(0,0,0,0.3); border-radius: 15px;"></div>
            </div>

            <div class="info-card" style="flex: 1;">
                <h3 style="margin-bottom: 20px; font-size: 16px; color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: 1px;">Step-by-Step Directions</h3>
                <div class="path-list" id="waypoints-list">
                    <!-- Waypoints injected here -->
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="Animation.js"></script>
    <script>
        let map;
        let allRestaurants = [];
        
        checkAuth();
        
        async function startApp() {
            try {
                initMap();
                loadRestaurants();
            } catch (err) {
                console.error("App init failed", err);
            }
        }

        let originMarker = null;

        function initMap() {
            // Initialize Leaflet map with a dark theme
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false
            }).setView([33.6844, 73.0479], 13);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 20,
                dragging: true,
                scrollWheelZoom: true,
                doubleClickZoom: true,
                touchZoom: true
            }).addTo(map);

            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // Add click listener for pinning origin
            map.on('click', function(e) {
                setOriginFromClick(e.latlng);
            });
            
            // Ensure map is interactive
            map.dragging.enable();
            map.scrollWheelZoom.enable();
        }

        function pinCurrentLocation() {
            if ("geolocation" in navigator) {
                const btn = document.getElementById('pin-location-btn');
                btn.innerHTML = '⌛';
                navigator.geolocation.getCurrentPosition(function(position) {
                    const latlng = { lat: position.coords.latitude, lng: position.coords.longitude };
                    setOriginFromClick(latlng);
                    map.setView(latlng, 15);
                    btn.innerHTML = '📍';
                }, function(err) {
                    alert('Geolocation failed. Please ensure location access is granted.');
                    btn.innerHTML = '📍';
                });
            } else alert('Geolocation not supported by this browser.');
        }

        function setOriginFromClick(latlng) {
            const originInput = document.getElementById('start-location-input');
            
            if (originMarker) map.removeLayer(originMarker);
            
            originMarker = L.marker(latlng, {
                draggable: true,
                icon: L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div style="background: #00e676; width: 15px; height: 15px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px rgba(0,230,118,0.5);"></div>`,
                    iconSize: [15, 15],
                    iconAnchor: [7, 7]
                })
            }).addTo(map);

            // Save coords to the input data
            originInput.value = `Pinned: ${latlng.lat.toFixed(4)}, ${latlng.lng.toFixed(4)}`;
            originInput.dataset.lat = latlng.lat;
            originInput.dataset.lng = latlng.lng;

            originMarker.on('dragend', function(event) {
                const position = event.target.getLatLng();
                setOriginFromClick(position);
            });
        }

        async function loadRestaurants() {
            const data = await apiRequest('/api/restaurants/search');
            if (data && data.restaurants) allRestaurants = data.restaurants;
        }

        const searchInput = document.getElementById('restaurant-search');
        const suggestionsList = document.getElementById('suggestions-dropdown');
        const selectedIdInput = document.getElementById('selected-restaurant-id');

        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase();
            suggestionsList.innerHTML = '';
            if (query.length < 1) { suggestionsList.style.display = 'none'; return; }
            const matches = allRestaurants.filter(r => r.name.toLowerCase().includes(query) || r.city.toLowerCase().includes(query));
            if (matches.length > 0) {
                suggestionsList.style.display = 'block';
                matches.forEach(match => {
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.style.padding = '15px 20px'; div.style.cursor = 'pointer'; 
                    div.style.transition = '0.2s'; div.style.color = 'white';
                    div.style.borderBottom = '1px solid rgba(255,255,255,0.05)';
                    div.innerHTML = `<span class="icon icon-map" style="margin-right: 12px; opacity: 0.5;"></span> ${match.name} <span style="color: var(--text-dim); font-size: 12px; margin-left: auto;">${match.city}</span>`;
                    div.onmouseover = () => { div.style.background = 'rgba(255, 61, 0, 0.1)'; };
                    div.onmouseout = () => { div.style.background = 'transparent'; };
                    div.onclick = () => { searchInput.value = match.name; selectedIdInput.value = match.id; suggestionsList.style.display = 'none'; };
                    suggestionsList.appendChild(div);
                });
            } else suggestionsList.style.display = 'none';
        });

        let currentRouteLine = null;
        let routeMarkers = [];

        async function calculateRoute() {
            const originInput = document.getElementById('start-location-input');
            const originStr = originInput.value;
            let restaurantId = selectedIdInput.value;
            // Fallback: search by name if ID was not set (manually typed)
            if (!restaurantId && searchInput.value) {
                const manualMatch = allRestaurants.find(r => r.name.toLowerCase() === searchInput.value.toLowerCase());
                if (manualMatch) {
                    restaurantId = manualMatch.id;
                    selectedIdInput.value = manualMatch.id;
                }
            }
            
            if (!originStr || !restaurantId) return alert('Please select origin (type or click map) and a restaurant.');
            
            const restaurant = allRestaurants.find(r => r.id === restaurantId);
            
            try {
                // Determine if we use pinned coords or named location
                const body = { restaurantId };
                if (originInput.dataset.lat && originInput.dataset.lng) {
                    body.startLat = parseFloat(originInput.dataset.lat);
                    body.startLng = parseFloat(originInput.dataset.lng);
                    body.startLocation = "Pinned Location";
                } else {
                    body.startLocation = originStr;
                }

                const data = await apiRequest('/api/route', {
                    method: 'POST',
                    body: JSON.stringify(body)
                });

                if (data && data.found) {
                    displayRouteDataOnLeaflet(data, restaurant);
                } else {
                    alert('Could not find a valid route. Try picking a location closer to the city.');
                }
            } catch (err) {
                console.error("Route calculation failed:", err);
            }
        }

        function displayRouteDataOnLeaflet(data, restaurant) {
            const pathCoords = data.path.map(p => [p.lat, p.lng]);
            
            // Clear old route
            if (currentRouteLine) map.removeLayer(currentRouteLine);
            routeMarkers.forEach(m => map.removeLayer(m));
            routeMarkers = [];

            // Draw polyline
            currentRouteLine = L.polyline(pathCoords, {
                color: '#ff3d00',
                weight: 6,
                opacity: 0.8,
                smoothFactor: 1
            }).addTo(map);

            // Add markers
            const startMarker = L.circleMarker(pathCoords[0], {
                radius: 8, fillColor: "#00e676", color: "#fff", weight: 2, opacity: 1, fillOpacity: 1
            }).addTo(map).bindPopup("Starting Point");
            
            const endMarker = L.circleMarker(pathCoords[pathCoords.length - 1], {
                radius: 10, fillColor: "#ff3d00", color: "#fff", weight: 2, opacity: 1, fillOpacity: 1
            }).addTo(map).bindPopup(restaurant.name);
            
            routeMarkers.push(startMarker, endMarker);

            // Fit map to route
            map.fitBounds(currentRouteLine.getBounds(), { padding: [50, 50] });

            // Stats Update
            document.getElementById('distance-stat').textContent = data.distance.toFixed(1);
            document.getElementById('time-stat').textContent = data.estimatedMinutes;
            document.getElementById('route-stats').style.display = 'flex';
            document.getElementById('info-panels').style.display = 'flex';

            const waypointsList = document.getElementById('waypoints-list');
            waypointsList.innerHTML = '';
            data.path.forEach((p, i) => {
                const div = document.createElement('div'); div.className = 'waypoint';
                div.innerHTML = `<strong>${i + 1}.</strong> Head towards ${p.name}`;
                waypointsList.appendChild(div);
            });
            drawGraph(data.path);
        }

        function drawGraph(path) {
            const container = document.getElementById('graph-canvas'); container.innerHTML = '';
            const w = container.clientWidth; const h = container.clientHeight;
            path.forEach((p, i) => {
                const x = 30 + (i / (path.length - 1)) * (w - 60); const y = (h / 2) + Math.sin(i * 1.5) * (h * 0.2);
                const node = document.createElement('div');
                node.style.position = 'absolute'; node.style.width = '12px'; node.style.height = '12px'; node.style.borderRadius = '50%';
                node.style.background = i === 0 ? '#00e676' : (i === path.length-1 ? '#ff3d00' : '#ff9100');
                node.style.left = x + 'px'; node.style.top = y + 'px'; container.appendChild(node);
                const label = document.createElement('div');
                label.style.position = 'absolute'; label.style.left = x + 'px'; label.style.top = (y + 15) + 'px';
                label.style.color = '#a0a0a0'; label.style.fontSize = '9px'; label.textContent = p.name; container.appendChild(label);
            });
        }

        // Sidebar logic is handled centrally in Animation.js
        startApp();
    </script>

</body>
</html>
