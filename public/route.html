<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Route - FOODLENZ</title>
    <link rel="stylesheet" href="Styles.css">
    <link rel="stylesheet" href="Responsive.css">
    <link rel="stylesheet" href="css/route.css">
    <link rel="stylesheet" href="Styles.css">
    <link rel="stylesheet" href="Responsive.css">
    <link rel="stylesheet" href="Styles.css">
    <link rel="stylesheet" href="Responsive.css">
    <link rel="stylesheet" href="css/route.css">
    <!-- Leaflet (Free Google Maps Alternative) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRSq550=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        #map {
            height: 500px;
            width: 100%;
            border-radius: 12px;
            margin-bottom: 20px;
            z-index: 0;
        }
        .leaflet-popup-content-wrapper {
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="top-bar">FOODLENZ</div>
    <div class="header">
        <a href="index.html"><img src="/public/Photoes/logo.jpg" alt="Logo" width="90" height="90"></a>
        <div class="school-name">
            <div>FOODLENZ</div>
            <div>Eat Smart, Reach Fast</div>
        </div>

        <button class="hamburger" id="hamburger">&#9776;</button>
        <nav id="main-nav">
            <a href="index.html">HOME</a>
            <a href="search.html">SEARCH</a>
            <a href="chatbot.html">AI BOT</a>
            <a href="route.html">MAP ROUTE</a>
            <button class="admissions-btn" onclick="logout()">LOGOUT</button>
        </nav>
    </div>

    <div class="sidebar" id="sidebar">
        <a href="index.html">HOME</a>
        <a href="search.html">SEARCH</a>
        <a href="chatbot.html">AI BOT</a>
        <a href="route.html">MAP ROUTE</a>
        <button class="admissions-btn" onclick="logout()">LOGOUT</button>
    </div>

    <div class="route-container">
        <div class="route-hero">
            <h1><div class="car-anim"></div> Find Your Route</h1>
            <p>Calculate the shortest path to your restaurant</p>
        </div>

        <div class="route-form">
            <div class="form-group">
                <label>Starting Location:</label>
                <select id="start-location">
                    <option value="">Select starting point</option>
                    <option value="Islamabad Center">Islamabad Center</option>
                    <option value="F-6 Islamabad">F-6 Islamabad</option>
                    <option value="Blue Area Islamabad">Blue Area Islamabad</option>
                    <option value="Lahore Center">Lahore Center</option>
                    <option value="Gulberg Lahore">Gulberg Lahore</option>
                    <option value="Karachi Center">Karachi Center</option>
                    <option value="Clifton Karachi">Clifton Karachi</option>
                </select>
            </div>

            <div class="form-group">
                <label>Restaurant:</label>
                <div class="autocomplete-container">
                    <input type="text" id="restaurant-search" placeholder="Type restaurant name..." autocomplete="off">
                    <div id="suggestions-dropdown" class="suggestions-list"></div>
                    <input type="hidden" id="selected-restaurant-id">
                </div>
            </div>

            <button class="calculate-btn" onclick="calculateRoute()">📍 Calculate Route</button>
        </div>

        <div class="route-info" id="route-info">
            <div class="route-stats">
                <div class="stat-box">
                    <h3 id="distance-stat">-</h3>
                    <p>Total Distance (km)</p>
                </div>
                <div class="stat-box">
                    <h3 id="time-stat">-</h3>
                    <p>Estimated Time (min)</p>
                </div>
            </div>

            <div class="route-split-container">
                <div class="map-column">
                    <h3 class="headers-title">Geographical Map</h3>
                    <div id="map"></div>
                </div>
                <div class="graph-column">
                    <h3 class="headers-title">Dijkstra's Graph Visualization</h3>
                    <div id="graph-canvas"></div>
                </div>
            </div>

            <div class="route-path">
                <h3>Route Waypoints:</h3>
                <div id="waypoints-list"></div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="Animation.js"></script>
    <script>
        checkAuth();
        
        let allRestaurants = [];
        let map = null;
        let routeLayer = null;
        let markers = [];

        // Load restaurants on page load
        loadRestaurantsForRoute();
        
        async function loadRestaurantsForRoute() {
            try {
                const data = await apiRequest('/api/restaurants/search');
                if (data && data.restaurants) {
                    allRestaurants = data.restaurants;
                }
            } catch (error) {
                console.error('Failed to load restaurants:', error);
            }
        }

        // Search Input Logic
        const searchInput = document.getElementById('restaurant-search');
        const suggestionsList = document.getElementById('suggestions-dropdown');
        const selectedIdInput = document.getElementById('selected-restaurant-id');

        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase();
            suggestionsList.innerHTML = '';
            
            if (query.length < 1) {
                suggestionsList.style.display = 'none';
                return;
            }

            const matches = allRestaurants.filter(r => 
                r.name.toLowerCase().includes(query) || 
                r.city.toLowerCase().includes(query)
            );

            if (matches.length > 0) {
                suggestionsList.style.display = 'block';
                matches.forEach(match => {
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.textContent = `${match.name} - ${match.city}`;
                    div.onclick = () => {
                        searchInput.value = match.name;
                        selectedIdInput.value = match.id;
                        suggestionsList.style.display = 'none';
                    };
                    suggestionsList.appendChild(div);
                });
            } else {
                suggestionsList.style.display = 'none';
            }
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            if (e.target !== searchInput && e.target !== suggestionsList) {
                suggestionsList.style.display = 'none';
            }
        });
        
        // Initialize Map on Load
        function initMap() {
            if (!map) {
                map = L.map('map').setView([33.6844, 73.0479], 13); // Default Center (Islamabad)
                L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                    subdomains: 'abcd',
                    maxZoom: 19
                }).addTo(map);
            }
        }
        
        // Call initialization
        initMap();
        
        async function calculateRoute() {
            const startLocation = document.getElementById('start-location').value;
            const restaurantId = document.getElementById('selected-restaurant-id').value;
            
            if (!startLocation || !restaurantId) {
                alert('Please select both starting location and restaurant (select from dropdown)');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/route`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${getAuthToken()}`
                    },
                    body: JSON.stringify({ startLocation, restaurantId })
                });
                
                const data = await response.json();
                
                if (data.found) {
                    displayRoute(data);
                } else {
                    alert('Route not found. Try different locations.');
                }
            } catch (error) {
                console.error('Failed to calculate route:', error);
                alert('Failed to calculate route. Please try again.');
            }
        }
        
        async function displayRoute(data) {
            // Stats
            document.getElementById('distance-stat').textContent = data.distance.toFixed(1);
            document.getElementById('time-stat').textContent = data.estimatedMinutes;
            
            const waypointsList = document.getElementById('waypoints-list');
            waypointsList.innerHTML = '';
            
            // Extract coordinates for the map
            const latlngs = data.path.map(p => [p.lat, p.lng]);
            
            // Ensure map is initialized (fallback)
            if (!map) initMap();
            
            // Clear previous layers
            if (routeLayer) map.removeLayer(routeLayer);
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            
            // Add Start Marker (Custom Icon)
            const startIcon = L.divIcon({
                className: 'custom-div-icon',
                html: "<div style='background-color:#00C853;width:15px;height:15px;border-radius:50%;border:2px solid white;box-shadow:0 0 5px rgba(0,0,0,0.5);'></div>",
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });

             const endIcon = L.divIcon({
                className: 'custom-div-icon',
                html: "<div style='background-color:#D50000;width:15px;height:15px;border-radius:50%;border:2px solid white;box-shadow:0 0 5px rgba(0,0,0,0.5);'></div>",
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });
            
            const startMarker = L.marker(latlngs[0], {icon: startIcon}).addTo(map)
                .bindPopup('<strong>Start:</strong> ' + data.path[0].name).openPopup();
            markers.push(startMarker);
            
            // Add End Marker
            const endMarker = L.marker(latlngs[latlngs.length - 1], {icon: endIcon}).addTo(map)
                .bindPopup('<strong>Destination:</strong> ' + data.path[data.path.length - 1].name);
            markers.push(endMarker);
            
            // Draw Route Line
            routeLayer = L.polyline(latlngs, {
                color: '#4285F4', // Google Maps Blue
                weight: 6,
                opacity: 0.8,
                lineJoin: 'round'
            }).addTo(map);
            
            // Fit bounds
            map.fitBounds(routeLayer.getBounds(), {padding: [50, 50]});
            
            // Fix rendering glitches
            setTimeout(() => { 
                map.invalidateSize(); 
                window.dispatchEvent(new Event('resize')); 
            }, 100);


            // Draw Algorithmic Graph
            setTimeout(() => { 
                drawGraph(data.path, data.graph); 
            }, 300);

            // Populate text list
            data.path.forEach((waypoint, index) => {
                const div = document.createElement('div');
                div.className = 'waypoint';
                div.innerHTML = `<strong>${index + 1}.</strong> ${waypoint.name}`;
                waypointsList.appendChild(div);
            });
        }
        
        // Fetch all graph nodes for visualization
        async function fetchGraphNodes() {
            try {
                const data = await apiRequest('/api/locations');
                if (data && data.locations) {
                    graphNodes = data.locations.map(l => l.name);
                }
            } catch (error) {
                console.error("Failed to fetch graph nodes", error);
            }
        }

        function drawGraph(path, fullGraph) {
            const container = document.getElementById('graph-canvas');
            if (!container) return;
            container.innerHTML = '';
            
            // Wait for layout
            if (container.clientWidth === 0) {
                setTimeout(() => drawGraph(path, fullGraph), 100);
                return;
            }
            
            const width = container.clientWidth;
            const height = container.clientHeight || 500;
            const padding = 40;
            
            const nodePositions = {};
            
            // --- 1. Process Nodes ---
            if (fullGraph && fullGraph.nodes && fullGraph.nodes.length > 0) {
                // Use Backend Data
                // Normalize coordinates to canvas size
                // We assume backend might send raw lat/long or relative coords? 
                // Actually backend Graph usually just has connectivity.
                // Let's use a force-directed layout or deterministic mapping for backend nodes.
                
                // For simplicity/robustness, we'll map them deterministically based on name hash
                // BUT highlight the ones in the path with specific flow logic
                
                // Helper
                const hash = s => s.split('').reduce((a,b)=>{a=((a<<5)-a)+b.charCodeAt(0);return a&a},0);
                const rng = (seed) => { const x = Math.sin(seed++) * 10000; return x - Math.floor(x); };

                // First, map Path nodes nicely (River Flow)
                path.forEach((p, i) => {
                    const tx = padding + (i / (path.length - 1)) * (width - 2*padding);
                    const ty = (height / 2) + Math.sin(i * 0.8) * (height * 0.25);
                    nodePositions[p.name] = { x: tx, y: ty, onPath: true };
                });

                // Then map remaining graph nodes
                fullGraph.nodes.forEach((nodeName) => {
                     if (!nodePositions[nodeName]) {
                        let h = hash(nodeName);
                        // Random pos but deterministic
                        const rx = padding + rng(h) * (width - 2*padding);
                        const ry = padding + rng(h + 7) * (height - 2*padding);
                        nodePositions[nodeName] = { x: rx, y: ry, onPath: false };
                     }
                });

                // --- 2. Process Edges from Backend ---
                // If backend provided edges, use them!
                if (fullGraph.edges) {
                     fullGraph.edges.forEach(edge => {
                         const p1 = nodePositions[edge.from];
                         const p2 = nodePositions[edge.to];
                         if (p1 && p2) {
                              drawEdge(container, p1, p2, '#e0e0e0', 1);
                         }
                     });
                } else {
                     // Fallback to synthetic mesh if no edges provided
                     connectMesh(nodePositions, container);
                }

            } else {
                // FALLBACK: Synthetic Generation (if backend data missing)
                // A. Path Nodes
                path.forEach((p, i) => {
                    const tx = padding + (i / (path.length - 1)) * (width - 2*padding);
                    const ty = (height / 2) + Math.sin(i * 0.8) * (height * 0.25);
                    nodePositions[p.name] = { x: tx, y: ty, onPath: true };
                });
                
                // B. Random Nodes
                for(let k=0; k<40; k++) {
                    const name = "GenNode_" + k;
                    if (!nodePositions[name]) {
                        const rx = padding + Math.random() * (width - 2*padding);
                        const ry = padding + Math.random() * (height - 2*padding);
                        // Simple Collision check
                        let tooClose = false;
                        for(let key in nodePositions) {
                             const d = Math.pow(rx - nodePositions[key].x, 2) + Math.pow(ry - nodePositions[key].y, 2);
                             if(d < 1600) tooClose = true;
                        }
                        if(!tooClose) nodePositions[name] = { x: rx, y: ry, onPath: false };
                    }
                }
                connectMesh(nodePositions, container);
            }

            // --- 3. Draw Path Connections (Highlight) ---
            for (let i = 0; i < path.length - 1; i++) {
                const n1 = path[i].name;
                const n2 = path[i+1].name;
                if (nodePositions[n1] && nodePositions[n2]) {
                    drawEdge(container, nodePositions[n1], nodePositions[n2], '#ff8800', 4, true);
                }
            }
            
            // --- 4. Draw Nodes ---
            drawNodes(container, nodePositions, path);
        }
        
        function connectMesh(nodePositions, container) {
            const allNames = Object.keys(nodePositions);
            allNames.forEach(n1 => {
                const p1 = nodePositions[n1];
                const others = allNames.filter(n => n !== n1).map(n2 => {
                    const p2 = nodePositions[n2];
                    return { pos: p2, dist: Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2) };
                }).sort((a,b) => a.dist - b.dist);
                
                others.slice(0, 3).forEach(other => {
                    drawEdge(container, p1, other.pos, '#e0e0e0', 1);
                });
            });
        }
        
        function drawNodes(container, nodePositions, path) {
            Object.keys(nodePositions).forEach(name => {
                const pos = nodePositions[name];
                const node = document.createElement('div');
                node.className = 'graph-node';
                node.style.left = pos.x + 'px';
                node.style.top = pos.y + 'px';
                node.title = name;
                
                if (pos.onPath) {
                    node.style.width = '18px';
                    node.style.height = '18px';
                    node.style.zIndex = '100';
                    node.style.boxShadow = '0 0 8px rgba(0,0,0,0.4)';
                    if (name === path[0].name) {
                        node.style.backgroundColor = '#00C853'; // Green
                        addLabel(container, name, pos.x, pos.y + 20, true);
                    } else if (name === path[path.length - 1].name) {
                        node.style.backgroundColor = '#D50000'; // Red
                         addLabel(container, name, pos.x, pos.y + 20, true);
                    } else {
                        node.style.backgroundColor = '#FF6D00'; // Orange
                        if(Math.random() > 0.6) addLabel(container, name, pos.x, pos.y + 20, false);
                    }
                } else {
                    node.style.width = '6px';
                    node.style.height = '6px';
                    node.style.backgroundColor = '#bdbdbd';
                    node.style.zIndex = '50';
                }
                container.appendChild(node);
            });
        }
        
        function addLabel(container, text, x, y, bold) {
            const label = document.createElement('div');
            label.className = 'graph-label';
            label.textContent = text.length > 15 ? text.substring(0, 12) + '...' : text;
            label.style.left = x + 'px';
            label.style.top = y + 'px';
            if(bold) {
                label.style.fontWeight = 'bold';
                label.style.color = '#000';
                label.style.zIndex = 20;
            } else {
                label.style.color = '#666';
            }
            container.appendChild(label);
        }
        
        function drawEdge(container, p1, p2, color, thickness, animate=false) {
            const length = Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
            const angle = Math.atan2(p1.y - p2.y, p1.x - p2.x) * 180 / Math.PI;
            
            const edge = document.createElement('div');
            edge.className = 'graph-edge';
            edge.style.width = length + 'px';
            edge.style.height = thickness + 'px';
            edge.style.background = color;
            
            // Fix: Anchor at P2 and rotate towards P1 (matches transform-origin: 0 50% in CSS)
            edge.style.left = p2.x + 'px';
            edge.style.top = p2.y + 'px';
            edge.style.transform = `rotate(${angle}deg)`;
            
             if (animate) {
                edge.style.transition = 'width 1s ease-out';
                edge.style.width = '0px';
                setTimeout(() => edge.style.width = length + 'px', 50);
            }
            
            container.appendChild(edge);
        }
    </script>
</body>
</html>
