<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - FOODLENZ</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="icon" href="/public/Photoes/logo.jpg" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>FOODLENZ</h1>
                <p>Eat Smart, Reach Fast</p>
            </div>
            
            <form id="signupForm" class="auth-form">
                <h2 style="margin-bottom: 20px;">Join the Community</h2>
                
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your full name">
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>
                
                <div class="form-group">
                    <label for="password">Create Password</label>
                    <input type="password" id="password" name="password" required placeholder="Minimum 6 characters" minlength="6">
                </div>
                
                <div class="form-group">
                    <label for="city">Your City</label>
                    <select id="city" name="city" required 
                            style="width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 14px 18px; color: white; font-size: 15px; outline: none; appearance: none; cursor: pointer;">
                        <option value="" style="background: #1a1a1a;">Select your city</option>
                        <option value="Islamabad" style="background: #1a1a1a;">Islamabad</option>
                        <option value="Lahore" style="background: #1a1a1a;">Lahore</option>
                        <option value="Karachi" style="background: #1a1a1a;">Karachi</option>
                        <option value="Rawalpindi" style="background: #1a1a1a;">Rawalpindi</option>
                        <option value="Faisalabad" style="background: #1a1a1a;">Faisalabad</option>
                    </select>
                </div>
                
                <div id="error-message" class="error-message"></div>
                
                <button type="submit" class="auth-btn">Start Exploring 🚀</button>
                
                <p class="auth-switch">
                    Already an explorer? <a href="signin.html" style="color: var(--accent); font-weight: 700;">Login here</a>
                </p>
            </form>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
