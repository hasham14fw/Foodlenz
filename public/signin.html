<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FOODLENZ</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="icon" href="/public/Photoes/logo.jpg" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>FOODLENZ</h1>
                <p>Eat Smart, Reach Fast</p>
            </div>

            <form id="loginForm" class="auth-form" method="POST">
                <h2 style="margin-bottom: 25px;">Welcome Back Explorer</h2>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>

                <div id="error-message" class="error-message"></div>

                <button type="submit" class="auth-btn">Authorize Access 🔐</button>

                <p class="auth-switch">
                    New to Foodlenz? <a href="signup.html" style="color: var(--accent); font-weight: 700;">Create Account</a>
                </p>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
